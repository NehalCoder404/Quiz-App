<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="startApp()">

    <div class="quizContainer">

        <div class="header">
            <h1>Frontend Quiz</h1>
            <p>Nehal Ali</p>
        </div>

        <div class="body">

            <p id="questionEle">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Veritatis, illo?</p>

            <ul id="optionEle">

            </ul>

        </div>

        <div class="footer">
            <p id="QusTotal"></p>
            <button disabled id="nextQusBtn" onclick="nextQuestion()">Next</button>
        </div>

    </div>


    <div class="reportCardContainer">

        <h1>Report Card</h1>
        <h3>Quiz Completed</h3>

        <div class="totalMarks">
            <p>Performance Summary</p>

            <div class="totalContact">
                <div class="TotalLeft">
                    <p>Total Question</p>
                    <h3>100</h3>
                    <p>Correct Answer</p>
                    <h3>100</h3>
                </div>

                <div class="TotalRight">
                    <p>Wrong Answer</p>
                    <h3>100</h3>
                    <p>Grad</p>
                    <h3>100</h3>
                </div>
                
            </div>

        </div>

    </div>


    <br>
    <br>
    <br>
    <br>
    <br>
    <br>


</body>
<script src="app.js"></script>

</html>
